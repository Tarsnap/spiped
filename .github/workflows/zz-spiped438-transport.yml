name: Transport spiped 438 fix

on:
  push:
    branches:
      - zz-sol-delta/spiped-438-dnsthread

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zz-sol-delta/spiped-438-dnsthread
          fetch-depth: 0
      - name: Apply completed dnsthread fix and self-remove
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = """"""
          Path("lib/dnsthread/dnsthread.c").write_bytes(base64.b64decode(data))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-spiped438-transport.yml
          git add lib/dnsthread/dnsthread.c
          git commit -m "Fix dnsthread wakeup registration ordering"
          git push origin HEAD:zz-sol-delta/spiped-438-dnsthread
